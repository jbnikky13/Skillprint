name: Skillprint Gmail Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: skillprint-gmail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Skillprint currently has no package-lock.json; disable setup-node caching
          # until a lockfile is committed, otherwise setup-node fails before install.
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync connected Gmail accounts
        run: npm run sync:gmail
        env:
          SUPABASE_URL: ${{ secrets.SKILLPRINT_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SKILLPRINT_SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_TOKEN_ENCRYPTION_KEY: ${{ secrets.SKILLPRINT_GMAIL_TOKEN_ENCRYPTION_KEY }}
